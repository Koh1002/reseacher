<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI論文要約エージェント | AI Paper Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI論文要約エージェント</h1>
            <p class="subtitle">最新の生成AIに関する論文を調査・要約・図解します</p>
        </header>

        <main>
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-container">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="検索キーワードを入力 (例: diffusion model, GPT, transformer)"
                        value="generative AI OR diffusion model OR large language model"
                    >
                    <div class="search-controls">
                        <select id="maxResults">
                            <option value="5">5件</option>
                            <option value="10" selected>10件</option>
                            <option value="20">20件</option>
                        </select>
                        <button onclick="searchPapers()" class="btn btn-primary">🔍 検索</button>
                        <button onclick="getLatestPapers()" class="btn btn-secondary">📰 最新論文</button>
                    </div>
                </div>

                <!-- Category Quick Buttons -->
                <div class="category-buttons">
                    <button onclick="searchByCategory('cs.AI')" class="btn-category">AI</button>
                    <button onclick="searchByCategory('cs.LG')" class="btn-category">機械学習</button>
                    <button onclick="searchByCategory('cs.CV')" class="btn-category">コンピュータビジョン</button>
                    <button onclick="searchByCategory('cs.CL')" class="btn-category">自然言語処理</button>
                </div>
            </section>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>論文を検索中...</p>
            </div>

            <!-- Results Section -->
            <section id="resultsSection" class="results-section" style="display: none;">
                <div class="results-header">
                    <h2>検索結果 (<span id="resultCount">0</span>件)</h2>
                    <button onclick="summarizeAllPapers()" class="btn btn-accent" id="summarizeAllBtn">
                        ✨ 全ての論文を要約
                    </button>
                </div>
                <div id="papersList" class="papers-list"></div>
            </section>

            <!-- Summary Modal -->
            <div id="summaryModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <div id="summaryContent"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by arXiv API & Claude AI | Made with ❤️ for researchers</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
